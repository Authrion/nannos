# Server-side Nannos stack. Images are pulled ready-built from GHCR, so the
# machine never spends CPU or memory on a build.
#
# The *.env files are written by the deploy workflow from repository secrets;
# they are never committed.

name: nannos

services:
  caddy:
    image: caddy:2-alpine
    container_name: nannos-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on:
      - console-frontend
      - keycloak

  console-frontend:
    image: ghcr.io/authrion/nannos-console-frontend:${TAG:-latest}
    container_name: nannos-console-frontend
    restart: unless-stopped
    volumes:
      # Replaces the config baked into the image: adds the /api/ proxy to
      # console-backend and rewrites the Origin header to one the backend
      # accepts.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - console-backend

  console-backend:
    image: ghcr.io/authrion/nannos-console-backend:${TAG:-latest}
    container_name: nannos-console-backend
    restart: unless-stopped
    env_file:
      - ./console-backend.env
    # RAMBLER_SSLMODE stays at the image default of "require": Neon accepts
    # TLS connections only.
    volumes:
      - console-storage:/data/storage

  orchestrator:
    image: ghcr.io/authrion/nannos-orchestrator:${TAG:-latest}
    container_name: nannos-orchestrator
    restart: unless-stopped
    env_file:
      - ./orchestrator.env
    networks:
      default:
        aliases:
          # The console picks http:// or https:// for the agent card by looking
          # for "localhost" in ORCHESTRATOR_BASE_DOMAIN — there is no separate
          # scheme setting. Nothing terminates TLS inside the compose network,
          # so an alias carrying that substring keeps the call on plain http.
          #
          # AGENT_BASE_URL must name this alias too. The console matches the
          # URL the agent card advertises against its own configured host, and
          # only then attaches the Authorization header — a mismatch sends the
          # message unauthenticated and the orchestrator answers 401.
          - orchestrator-localhost
    volumes:
      - orchestrator-storage:/data/storage

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: nannos-keycloak
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # This URL is baked into the "iss" claim of every token and both
      # services compare it character by character, so it has to match
      # OIDC_ISSUER in the env files exactly.
      KC_HOSTNAME: https://${PUBLIC_HOST}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Its own schema in the shared database. Without external storage every
      # user and client disappears the first time the container is recreated.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST}/${KC_DB_NAME}?sslmode=require
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: keycloak
    volumes:
      # Imported only on the first start against an empty schema; after that
      # the admin console is the place to change things.
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nannos-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - ./litellm.env
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro

volumes:
  caddy-data:
  caddy-config:
  console-storage:
  orchestrator-storage:
