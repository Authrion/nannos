server {
    listen 8081;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed for the runtime resolution below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy the API to console-backend: the SPA calls same-origin /api/v1/* paths,
    # so without this the SPA fallback below answers them with index.html.
    location /api/ {
        # The upstream goes through a variable on purpose. With a literal name
        # nginx resolves it once at startup and caches the address forever, so a
        # console-backend restart moves it to a new IP and every request 502s.
        # A variable defers resolution to request time.
        set $console_backend "console-backend:5001";
        proxy_pass http://$console_backend;
        proxy_http_version 1.1;
        # $http_host keeps the ":8081" the browser used; bare $host drops it and the
        # backend then builds an OIDC redirect_uri without the port, which Keycloak rejects.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Caddy terminates TLS and passes the original scheme along; $scheme here
        # would be the plain http of the Caddy-to-nginx hop, and the backend would
        # then build an http:// redirect_uri that Keycloak rejects.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Origin is passed through untouched. It used to be rewritten to
        # localhost:5001 because the backend ran with ENVIRONMENT=local, whose
        # Socket.IO allowlist only holds localhost ports. On prod the allowlist
        # is built from BASE_DOMAIN, so the real Origin is the accepted one.
        # Socket.IO (/api/v1/socket.io) needs the upgrade handshake preserved.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 'OK';
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
