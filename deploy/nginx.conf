server {
    listen 8081;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API to console-backend: the SPA calls same-origin /api/v1/* paths,
    # so without this the SPA fallback below answers them with index.html.
    location /api/ {
        proxy_pass http://console-backend:5001;
        proxy_http_version 1.1;
        # $http_host keeps the ":8081" the browser used; bare $host drops it and the
        # backend then builds an OIDC redirect_uri without the port, which Keycloak rejects.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # console-backend hardcodes its Socket.IO CORS allowlist (app.py: localhost:5001 and
        # localhost:5173 only) and rejects anything else with "is not an accepted origin".
        # This page is served from a different port, so present an accepted Origin upstream.
        # Same-origin in the browser either way — the SPA calls its own host.
        proxy_set_header Origin http://localhost:5001;
        # Socket.IO (/api/v1/socket.io) needs the upgrade handshake preserved.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 'OK';
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
