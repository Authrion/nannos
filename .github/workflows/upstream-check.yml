# Раз в неделю сообщает, насколько форк отстал от ringier-data/nannos,
# и отдельно предупреждает об изменениях в их Dockerfile — их правки
# приходится вручную переносить в наши копии .local.
name: upstream-check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сравнить с апстримом
        run: |
          git remote add upstream https://github.com/ringier-data/nannos.git
          git fetch upstream main --quiet

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "### Отставание от апстрима: $BEHIND коммитов" >> $GITHUB_STEP_SUMMARY

          if [ "$BEHIND" -eq 0 ]; then
            echo 'Всё синхронно.' >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo '' >> $GITHUB_STEP_SUMMARY
          echo '#### Новые коммиты' >> $GITHUB_STEP_SUMMARY
          git log --oneline HEAD..upstream/main | head -25 >> $GITHUB_STEP_SUMMARY

          DF=$(git log --oneline HEAD..upstream/main -- \
                 packages/orchestrator-agent/Dockerfile \
                 packages/console-backend/Dockerfile)
          if [ -n "$DF" ]; then
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '#### Изменились Dockerfile — обновите копии .local' >> $GITHUB_STEP_SUMMARY
            echo "$DF" >> $GITHUB_STEP_SUMMARY
          fi
