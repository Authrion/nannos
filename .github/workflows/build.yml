# Собирает три образа Nannos и кладёт их в GitHub Container Registry.
# Секретов в образах нет — только код; настройки приезжают на этапе деплоя.
name: build

on:
  push:
    branches: [main, deploy/aws]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nannos-orchestrator
            context: packages/orchestrator-agent
            file: packages/orchestrator-agent/Dockerfile.local
            target: ''
          - name: nannos-console-backend
            context: packages/console-backend
            file: packages/console-backend/Dockerfile.local
            target: api
          - name: nannos-console-frontend
            context: packages/console-frontend
            file: packages/console-frontend/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          # Общие пакеты подключаются как именованные контексты — так же,
          # как в локальном docker-compose.yml.
          build-contexts: |
            ringier-a2a-sdk=packages/ringier-a2a-sdk
            agent-common=packages/agent-common
            object-storage=packages/object-storage
          push: true
          # Тег по SHA нужен для отката: запустить deploy с прежним SHA
          # и пересборка не потребуется.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
